[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-classification"
version = "0.1.0"
description = "Projet IFT712 de classification de feuilles"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".venv",
    "data",
    "results",
    "docs/rapport_parts_pdf",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/experiments/figure_runner.py" = ["E402"]
"src/notebook_support.py" = ["E501"]
"tests/test_report_readiness.py" = ["E501"]
